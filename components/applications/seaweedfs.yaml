apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seaweedfs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://seaweedfs.github.io/seaweedfs/helm
    targetRevision: 4.26.0
    chart: seaweedfs
    helm:
      values: |
        global:
          createClusterRole: true

        master:
          enabled: true
          replicas: 1
          port: 9333
          grpcPort: 19333
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 500m
          livenessProbe:
            enabled: true
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            enabled: true
            initialDelaySeconds: 10
            periodSeconds: 15

        volume:
          enabled: true
          replicas: 1
          port: 8080
          grpcPort: 18080
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          livenessProbe:
            enabled: true
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            enabled: true
            initialDelaySeconds: 10
            periodSeconds: 15

        filer:
          enabled: true
          replicas: 1
          port: 8888
          grpcPort: 18888
          disableDirListing: true
          s3:
            enabled: true
            port: 8333
            enableAuth: true
            existingConfigSecret: seaweedfs-s3-config
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          # disableDirListing 403s the default GET / health check, so use a
          # plain TCP connect instead — the chart already supports this same
          # switch for JWT-enabled filers, same fix applies here.
          livenessProbe:
            enabled: true
            initialDelaySeconds: 20
            periodSeconds: 30
            tcpSocket:
              port: 8888
          readinessProbe:
            enabled: true
            initialDelaySeconds: 10
            periodSeconds: 15
            tcpSocket:
              port: 8888

        s3:
          enabled: true
          port: 8333

  destination:
    server: https://kubernetes.default.svc
    namespace: seaweedfs

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
